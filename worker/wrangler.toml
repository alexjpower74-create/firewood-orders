name = "firewood-orders"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Local dev/tests use the top level (wrangler dev --local, with an R2 stand-in). The live Worker is `--env production`, deployed
# 2026-09-15 on Alexander's go: `npx wrangler deploy --env production`. TEST_MODE is never set here: tests pass --var TEST_MODE:1.

[[d1_databases]]
binding = "DB"
database_name = "firewood-orders"
database_id = "97b97222-afb7-4f24-bac9-1b8cd270295d"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "firewood-orders-photos"

[assets]
directory = "../app/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# The base map, in one place: the MapLibre style URL and the attribution its provider requires (GET /api/info hands both to the
# pages). OpenFreeMap: free, commercial use allowed, no key, no limits, no SLA. To switch provider, change these two lines.
[vars]
MAP_STYLE_URL = "https://tiles.openfreemap.org/styles/liberty"
MAP_ATTRIBUTION = '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> <a href="https://www.openmaptiles.org/" target="_blank">&copy; OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'

# Production. Wrangler environments do not inherit bindings, so everything is said again here, except R2: R2 is not enabled on
# the Cloudflare account (a dashboard step, Alexander's call). Without the PHOTOS binding delivery photos answer "not set up"
# and everything else works. Once R2 is on: `wrangler r2 bucket create firewood-orders-photos`, add the [[env.production.r2_buckets]]
# block (binding "PHOTOS"), deploy again.
[env.production]
name = "firewood-orders"

[[env.production.d1_databases]]
binding = "DB"
database_name = "firewood-orders"
database_id = "97b97222-afb7-4f24-bac9-1b8cd270295d"
migrations_dir = "migrations"

[env.production.assets]
directory = "../app/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[env.production.vars]
MAP_STYLE_URL = "https://tiles.openfreemap.org/styles/liberty"
MAP_ATTRIBUTION = '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> <a href="https://www.openmaptiles.org/" target="_blank">&copy; OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
