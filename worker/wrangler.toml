name = "firewood-orders"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Local only tonight (wrangler dev --local). TEST_MODE is never set here: tests pass --var TEST_MODE:1.

[[d1_databases]]
binding = "DB"
database_name = "firewood-orders"
# Placeholder: a real deploy replaces this with the id from `wrangler d1 create` (see docs/DEPLOY.md).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "firewood-orders-photos"

[assets]
directory = "../app/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# The base map, in one place: the MapLibre style URL and the attribution its provider requires (GET /api/info hands both to the
# pages). OpenFreeMap: free, commercial use allowed, no key, no limits, no SLA. To switch provider, change these two lines.
[vars]
MAP_STYLE_URL = "https://tiles.openfreemap.org/styles/liberty"
MAP_ATTRIBUTION = '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> <a href="https://www.openmaptiles.org/" target="_blank">&copy; OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
